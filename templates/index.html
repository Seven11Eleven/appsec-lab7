<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>NoteVault</title>
</head>
<body>
    <h1>NoteVault — заметки</h1>
    {% if user %}
        <p>Пользователь: {{ user }}</p>
    {% endif %}
    <ul>
        {% for note in notes %}
            <li>№{{ note[0] }} <b>{{ note[2] }}</b> — {{ note[3] }}</li>
        {% endfor %}
    </ul>
    <form action="/notes/add" method="post">
        <input type="hidden" name="user" value="{{ user }}">
        <input type="text" name="title" placeholder="Заголовок">
        <input type="text" name="body" placeholder="Текст заметки">
        <button type="submit">Добавить</button>
    </form>
    <p><a href="/search?q=vault">Поиск</a></p>
</body>
</html>
