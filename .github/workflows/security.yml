name: security-scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Создание директории для отчётов
        run: mkdir -p reports
      - name: semgrep → SARIF
        run: >-
          semgrep scan --config p/python --config p/secrets
          --exclude reports --exclude .git
          --sarif --output reports/sast.sarif
        continue-on-error: true
      - name: semgrep → текстовый отчёт
        run: >-
          semgrep scan --config p/python --config p/secrets
          --exclude reports --exclude .git
          --text > reports/sast.txt
        continue-on-error: true
      - name: Публикация артефактов
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: reports/sast.*
          if-no-files-found: error

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка pip-audit
        run: python -m pip install -U pip-audit
      - name: pip-audit → JSON-отчёт
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/sca.json
          # markdown-вывод pip-audit не создаёт файл при нулевом количестве
          # уязвимостей, поэтому раньше падал upload-artifact. JSON пишется
          # всегда; дополнительно гарантируем существование файла:
          if [ ! -s reports/sca.json ]; then
            echo "pip-audit did not produce a report — see job log" > reports/sca.json
          fi
        continue-on-error: true
      - name: Публикация артефактов
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: reports/sca.json
          if-no-files-found: error
